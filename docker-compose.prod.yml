version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: archive_vision-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archive_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: yankadi/archive-vision-backend:latest
    container_name: archive_vision-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/archive_db
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data

  frontend:
    image: yankadi/archive-vision-frontend:latest
    container_name: archive_vision-frontend
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8001/api/v1
    ports:
      - "8501:8501"

volumes:
  postgres_data:
